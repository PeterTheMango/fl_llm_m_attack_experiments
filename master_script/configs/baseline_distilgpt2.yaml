# Baseline evaluation of all 11 MIA adaptations -- distilgpt2 (82M), file 1 of 5.
#
# The five baseline_*.yaml files together form ONE experiment: the same 11
# attacks x 3 federated_rounds x 3 seeds grid run against five target models
# (distilgpt2, gpt2, opt-125m, gpt2-medium, pythia-410m). 99 runs per file,
# 495 in total.
#
# Why one file per model instead of `sweep: {model_id: [...]}`: sweep is an
# itertools.product grid, so it cannot PAIR two fields. wbc needs
# reference_model_id to track model_id (compare the fine-tuned target against
# its own pre-fine-tune base, as the paper does); a shared sweep would leave
# wbc scoring every target against whatever single reference was listed.
# Splitting by model also lets sim_num_gpus follow the model's footprint, and
# gives the sweep a natural checkpoint every 99 runs.
#
# Cost per run = attack_trials x federated_rounds x clients_per_round client
# fine-tunes, and every client fit reloads the model from disk
# (core/federation.py). At 16 trials and 8 clients per round that is 128 /
# 384 / 768 fits for rounds 1 / 3 / 6.
#
# Run it (Firestore on, so completed runs cache-hit and a killed sweep resumes):
#
#     python -m master_script.perform_experiments \
#         --config master_script/configs/baseline_distilgpt2.yaml --max-parallel 2
#
# NOTE on thresholds: every attack's `threshold` is a constant tuned for
# sshleifer/tiny-gpt2 and is deliberately left untouched here. Across five
# models it is miscalibrated, so `pred_member` -- and therefore Adv -- is only
# comparable WITHIN a model. Compare across models using AUC/ROC, which the
# dashboard computes from attack_trials[] and which needs no threshold.

defaults:
  use_hf_models: true       # real HF model + Flower FL. amia/loss have no toy path anyway.
  model_id: distilgpt2
  num_clients: 16           # 4 hand-written partitions + 12 generated (core/federation.py)
  clients_per_round: 8      # fraction_fit = 0.5 -> FedAvg samples a real subset each round
  local_epochs: 3           # near-free: per-client model LOAD dominates, not the 3-record fit
  local_batch_size: 4
  attack_trials: 16         # 16 ROC points per cell; x3 seeds = 48 per (model, rounds) cell
  sim_num_gpus: 0.5         # two client actors share the 20GB MIG slice
  keep_artifacts: false
  # max_length stays at its default 64: the client records are ~20 tokens, so
  # raising it would change every run_id without changing any computation.

attacks:
  zlib:
    # Anchored so the other ten attacks share one definition of the grid.
    sweep: &grid
      federated_rounds: [1, 3, 6]
      seed: [7, 11, 23]
  min_k:
    sweep: *grid
  min_k_plus_plus:
    sweep: *grid
  neighborhood:
    sweep: *grid
  recall:
    sweep: *grid
  reference:
    sweep: *grid
  samia:
    sweep: *grid
  spv_mia:
    sweep: *grid
  wbc:
    base:
      reference_model_id: distilgpt2   # paired with model_id, not swept
    sweep: *grid
  amia:
    sweep: *grid
  loss:
    sweep: *grid
