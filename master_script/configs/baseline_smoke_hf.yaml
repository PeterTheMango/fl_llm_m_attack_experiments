# Pre-flight check for the baseline_*.yaml sweep. NOT part of the baseline.
#
# The five target models span three architectures (GPT-2, OPT, GPT-NeoX), and
# core/federation.py round-trips weights through get_parameters ->
# ndarrays_to_parameters -> FedAvg mean -> load_state_dict(strict=True) over the
# FULL state_dict, buffers included. That path is only proven on GPT-2 here, so
# run this first: 20 short runs that touch all five models and all three code
# paths (the nine modern scorers, amia's custom_trials, loss's own FL loop).
# If a model family breaks the parameter round-trip, it fails here in minutes
# instead of hours into the real sweep.
#
#     python -m master_script.perform_experiments \
#         --config master_script/configs/baseline_smoke_hf.yaml --no-firestore --no-charts
#
# --no-firestore on purpose: these 2-trial configs are not results and should
# not land in the results collection next to the real ones.

defaults:
  use_hf_models: true
  num_clients: 16
  clients_per_round: 8
  local_epochs: 1
  local_batch_size: 4
  attack_trials: 2
  federated_rounds: 1
  seed: 7
  sim_num_gpus: 1.0

attacks:
  zlib:
    sweep: &models
      model_id:
        - distilgpt2
        - gpt2
        - facebook/opt-125m
        - gpt2-medium
        - EleutherAI/pythia-410m
  wbc:
    # reference_model_id intentionally left at its default here: this file
    # checks that the models LOAD and aggregate, not that WBC is calibrated.
    sweep: *models
  amia:
    sweep: *models
  loss:
    sweep: *models
