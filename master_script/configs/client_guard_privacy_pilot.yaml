# Mechanics pilot: six runs, not a detector effectiveness study.
# No learned artifact is fabricated. Use tools.build_guard_pilot after fitting.
# Rules/shadow are explicitly diagnostic; no formal privacy claim.
defaults:
  use_hf_models: true
  model_id: Qwen/Qwen2.5-0.5B-Instruct
  model_revision: 7ae557604adf67be50417f59c2c2f167def9a775
  reference_model_id: Qwen/Qwen2.5-0.5B-Instruct
  dataset_name: squad_research
  dataset_revision: 7b6d24c440a36b6815f21b70d25016731768db1f
  num_clients: 4
  clients_per_round: 4
  federated_rounds: 1
  local_epochs: 1
  local_batch_size: 2
  client_lr: 2.0e-05
  attack_trials: 4
  max_length: 128
  seed: 7
  sim_num_gpus: 1.0
  sim_max_concurrent_clients: 1
  keep_artifacts: true
  threshold_mode: calibrated
  calibration_nonmember_count: 20
  calibration_fpr: 0.05
pipeline:
  condition: baseline
  defense:
    mechanism: none
  rag: &id001
    study_file: research_data/squad_rag_study.json
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    top_k: 4
    max_context_tokens: 768
    max_new_tokens: 64
    prompt_format: chat
    significance: 0.05
    evaluation_trials: 2
    defenses:
    - ordinary
    membership_overlap: true
attacks:
  amia:
    base:
      attack_targets: 1
      attack_batch_size: 4
      probe_epochs: 4
      probe_lr: 0.005
      adversary_negative_count: 16
      ldp_target_samples: 128
      certificate_samples: 256
      ldp_mechanism: none
      observation_defense: none
      observation_clip_norm: 1.0
      observation_delta: 1.0e-05
    sweep: &id002
      seed:
      - 7
    variants:
    - pipeline:
        condition: baseline
        defense:
          mechanism: none
        rag: *id001
    - pipeline:
        condition: rules_only
        defense:
          mechanism: none
        rag: *id001
        client_guard:
          mode: rules
          policy_file: guard/approved_training_policy.json
          release_budget: 10
          diagnostic: true
    - base:
        observation_defense: gaussian
        observation_noise_multiplier: 1.0
      pipeline:
        condition: noise_only
        defense:
          mechanism: none
        rag: *id001
    - pipeline:
        condition: shadow
        defense:
          mechanism: none
        rag: *id001
        client_guard:
          mode: shadow
          policy_file: guard/approved_training_policy.json
          release_budget: 10
          diagnostic: true
  reference:
    base:
      threshold: -0.75
    sweep: *id002
    variants:
    - pipeline:
        condition: baseline
        defense:
          mechanism: none
        rag: *id001
    - pipeline:
        condition: shadow
        defense:
          mechanism: none
        rag: *id001
        client_guard:
          mode: shadow
          policy_file: guard/approved_training_policy.json
          release_budget: 10
          diagnostic: true
