# Federated-round sweep: all 11 attacks across 1, 2, and 4 FL rounds.
# 33 runs total; every other value matches baseline_master.yaml.

defaults:
  use_hf_models: true
  model_id: distilgpt2
  dataset_name: squad
  num_clients: 2
  clients_per_round: 2
  federated_rounds: 1
  local_epochs: 1
  local_batch_size: 4
  attack_trials: 6
  max_length: 64
  seed: 7
  sim_num_gpus: 0.5
  keep_artifacts: false

attacks:
  zlib:
    sweep:
      federated_rounds: &rounds [1, 2, 4]
  min_k:
    sweep:
      federated_rounds: *rounds
  min_k_plus_plus:
    sweep:
      federated_rounds: *rounds
  neighborhood:
    base: {num_neighbours: 6}
    sweep:
      federated_rounds: *rounds
  recall:
    base: {num_shots: 1}
    sweep:
      federated_rounds: *rounds
  reference:
    sweep:
      federated_rounds: *rounds
  samia:
    base: {num_samples: 3}
    sweep:
      federated_rounds: *rounds
  spv_mia:
    base: {num_paraphrases: 2, self_prompt_tokens: 4}
    sweep:
      federated_rounds: *rounds
  wbc:
    base: {reference_model_id: distilgpt2}
    sweep:
      federated_rounds: *rounds
  amia:
    base: {probe_epochs: 20, attack_batch_size: 4}
    sweep:
      federated_rounds: *rounds
  loss:
    base: {calibration_nonmember_count: 6}
    sweep:
      federated_rounds: *rounds
