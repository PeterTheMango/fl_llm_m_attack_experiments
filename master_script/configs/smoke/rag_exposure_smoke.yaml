# Smoke test for the context_exposure_v2 audit (core fingerprint 4b82f0dd4eb4).
# One Reference run, one FL round, RAG on the first trial only, all four RAG
# defense conditions plus overlap cells. No client guard: no guard targets or
# reserved-final cohort are touched. Checks audit mechanics, not attack
# reliability or privacy protection. keep_artifacts retains private-audit/.

defaults:
  use_hf_models: true
  model_id: Qwen/Qwen2.5-0.5B-Instruct
  model_revision: 7ae557604adf67be50417f59c2c2f167def9a775
  reference_model_id: Qwen/Qwen2.5-0.5B-Instruct
  dataset_name: squad_research
  dataset_revision: 7b6d24c440a36b6815f21b70d25016731768db1f
  num_clients: 4
  clients_per_round: 4
  federated_rounds: 1
  local_epochs: 1
  local_batch_size: 2
  client_lr: 0.00002
  attack_trials: 2
  max_length: 128
  seed: 7
  sim_num_gpus: 1.0
  sim_max_concurrent_clients: 1
  keep_artifacts: true
  threshold_mode: calibrated
  calibration_nonmember_count: 20
  calibration_fpr: 0.05

pipeline:
  condition: rag_exposure_smoke
  defense: {mechanism: none}
  rag: &rag
    study_file: ../research_data/squad_rag_study.json
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    top_k: 4
    max_context_tokens: 768
    max_new_tokens: 64
    prompt_format: chat
    significance: 0.05
    evaluation_trials: 1
    defenses: [ordinary, mirabel, instruction, mirabel_instruction]
    membership_overlap: true

attacks:
  reference:
    base:
      threshold: -0.75
    sweep:
      seed: [7]
    variants:
      - pipeline: {condition: rag_exposure_smoke, defense: {mechanism: none}, rag: *rag}
